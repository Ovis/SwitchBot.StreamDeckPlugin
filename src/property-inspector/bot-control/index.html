<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>SwitchBot Bot Control</title>
  <script src="sdpi-components.js"></script>
  <script src="bot-control.js"></script>
  <link rel="stylesheet" href="authentication.css" />
  <style>
    .execution-diagnostics { margin-top: 12px; border-top: 1px solid #555; padding-top: 8px; }
    .diagnostics-preview { margin: 6px 8px 10px; padding: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.45 ui-monospace, "Cascadia Mono", monospace; color: #d8d8d8; }
  </style>
</head>
<body>
  <div id="switchbot-authentication"></div>
  <sdpi-item label="__MSG_device__">
    <sdpi-select id="device" loading="__MSG_loadingDevices__" placeholder="__MSG_selectDevice__"></sdpi-select>
  </sdpi-item>
  <sdpi-item>
    <sdpi-button id="refresh-catalog">Refresh</sdpi-button>
  </sdpi-item>
  <sdpi-item label="__MSG_operation__">
    <sdpi-select id="operation" placeholder="__MSG_selectOperation__"></sdpi-select>
  </sdpi-item>
  <div id="catalog-status" aria-live="polite"></div>\n  <div id="request-heading">Request Body</div>\n  <pre id="request-preview" class="diagnostics-preview"></pre>
  <p id="advanced-note"></p>
  <div id="execution-diagnostics" class="execution-diagnostics" hidden>
    <div id="execution-diagnostics-heading">Latest execution result</div>
    <pre id="execution-diagnostics-summary" class="diagnostics-preview"></pre>
    <pre id="execution-diagnostics-response" class="diagnostics-preview"></pre>
  </div>
</body>
</html>
