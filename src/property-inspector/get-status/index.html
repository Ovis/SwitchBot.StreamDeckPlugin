<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>SwitchBot Get Status</title>
  <script src="sdpi-components.js"></script>
  <script src="get-status.js"></script>
  <link rel="stylesheet" href="authentication.css" />

  <style>
    .execution-diagnostics { margin-top: 12px; border-top: 1px solid #555; padding-top: 8px; }
    .diagnostics-preview { margin: 6px 8px 10px; padding: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.45 ui-monospace, "Cascadia Mono", monospace; color: #d8d8d8; }
    .template-help { margin: 4px 8px 8px; font-size: 11px; line-height: 1.45; color: #c8c8c8; }
    .status-field-list { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 8px 10px; }
    .status-field-button { border: 1px solid #666; border-radius: 4px; padding: 3px 6px; background: #3a3a3a; color: #eee; cursor: pointer; font: 11px ui-monospace, "Cascadia Mono", monospace; }
    .status-field-button:hover { background: #4a4a4a; }\n    .status-template-textarea { box-sizing: border-box; width: calc(100% - 16px); min-height: 90px; margin: 4px 8px; resize: vertical; background: #2d2d2d; color: #eee; border: 1px solid #666; border-radius: 3px; padding: 6px; font: 12px/1.4 ui-monospace, "Cascadia Mono", monospace; }
  </style>
</head>
<body>
  <sdpi-item id="device-item" label="__MSG_device__">
    <sdpi-select
      id="device-select"
      setting="deviceId"
      label-setting="deviceLabel"
      datasource="getDevices"
      loading="__MSG_loadingDevices__"
      placeholder="__MSG_selectDevice__"
      show-refresh
      hot-reload>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item id="button-name-item" label="__MSG_buttonName__">
    <sdpi-textfield setting="buttonName"></sdpi-textfield>
  </sdpi-item>
  <div id="catalog-status" aria-live="polite"></div>
  <div id="output-heading" class="section-heading" data-ja-text="出力">Output</div>
  <sdpi-item id="show-key-item" label="__MSG_showOnKey__">
    <sdpi-checkbox setting="output.showStatusOnKey" default="true"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item id="status-template-item" label="Template"></sdpi-item>
  <textarea id="status-template" class="status-template-textarea" rows="5"></textarea>
  <div id="template-help" class="template-help"></div>
  <div id="status-fields-heading" class="template-help"></div>
  <div id="status-field-list" class="status-field-list"></div>
  <sdpi-item id="copy-json-item" label="__MSG_copyJson__">
    <sdpi-checkbox setting="output.copyResponseToClipboard"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item id="pretty-item" label="__MSG_prettyPrint__">
    <sdpi-checkbox setting="output.prettyPrint" default="true"></sdpi-checkbox>
  </sdpi-item>
  <div id="execution-diagnostics" class="execution-diagnostics" hidden>
    <div id="execution-diagnostics-heading" class="section-heading">Latest execution result</div>
    <pre id="execution-diagnostics-summary" class="diagnostics-preview"></pre>
    <pre id="execution-diagnostics-response" class="diagnostics-preview"></pre>
  </div>
  <div id="switchbot-authentication"></div>
</body>
</html>
