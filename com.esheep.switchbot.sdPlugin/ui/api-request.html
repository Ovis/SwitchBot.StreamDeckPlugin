<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>SwitchBot API Request</title>
  <script src="sdpi-components.js"></script>
  <script src="localization.js"></script>
  <style>
    [hidden] { display: none !important; }
    #json-status, #catalog-status { margin: 4px 8px 8px 116px; font-size: 11px; }
    #sample-body-item { margin-top: 4px; }
    .valid { color: #69c779; }
    .invalid { color: #e57373; }
    .endpoint-preview { margin: 4px 8px 10px; font: 11px/1.45 ui-monospace, "Cascadia Mono", monospace; overflow-wrap: anywhere; color: #d8d8d8; }
  </style>
  <link rel="stylesheet" href="authentication.css" />
</head>
<body>
  <div id="switchbot-authentication"></div>

  <sdpi-item id="endpoint-item" label="__MSG_endpoint__">
    <sdpi-select setting="endpoint" default="custom" id="endpoint" datasource="getApiEndpoints"></sdpi-select>
  </sdpi-item>
  <div id="preset-preview" class="endpoint-preview" hidden></div>

  <sdpi-item id="device-item" label="__MSG_device__" hidden>
    <sdpi-select id="device" setting="deviceId" datasource="getDevices" loading="__MSG_loadingDevices__" placeholder="__MSG_selectDevice__" show-refresh hot-reload></sdpi-select>
  </sdpi-item>
  <sdpi-item id="scene-item" label="__MSG_scene__" hidden>
    <sdpi-select setting="sceneId" datasource="getScenes" loading="__MSG_loadingScenes__" placeholder="__MSG_selectScene__" show-refresh hot-reload></sdpi-select>
  </sdpi-item>
  <div id="catalog-status" class="invalid" aria-live="polite"></div>

  <sdpi-item id="method-item" label="__MSG_method__">
    <sdpi-select setting="method" default="POST" id="method">
      <option value="GET">GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="DELETE">DELETE</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item id="path-item" label="__MSG_path__">
    <sdpi-textfield id="path" setting="path" placeholder="/v1.1/devices/{deviceId}/commands"></sdpi-textfield>
  </sdpi-item>

  <div id="body-item">
    <sdpi-item label="__MSG_requestBody__"><sdpi-textarea id="request-body" setting="body" rows="8"></sdpi-textarea></sdpi-item>
    <div id="json-status" aria-live="polite"></div>
    <sdpi-item id="sample-body-item" label="__MSG_sampleJson__" hidden>
      <sdpi-button id="sample-body-button">Set sample JSON</sdpi-button>
    </sdpi-item>
  </div>

  <sdpi-item label="__MSG_copyResponse__"><sdpi-checkbox setting="output.copyResponseToClipboard"></sdpi-checkbox></sdpi-item>
  <sdpi-item label="__MSG_prettyPrint__"><sdpi-checkbox setting="output.prettyPrint" default="true"></sdpi-checkbox></sdpi-item>

  <script>
    const { streamDeckClient } = SDPIComponents;
    const endpoint = document.getElementById("endpoint"), method = document.getElementById("method");
    const methodItem = document.getElementById("method-item"), pathItem = document.getElementById("path-item"), path = document.getElementById("path");
    const deviceItem = document.getElementById("device-item"), device = document.getElementById("device"), sceneItem = document.getElementById("scene-item");
    const preview = document.getElementById("preset-preview"), bodyItem = document.getElementById("body-item");
    const body = document.getElementById("request-body"), status = document.getElementById("json-status"), catalogStatus = document.getElementById("catalog-status");
    const sampleBodyItem = document.getElementById("sample-body-item"), sampleBodyButton = document.getElementById("sample-body-button");
    let definitions = new Map();
    let commandTemplates = new Map();
    let lastAutoTemplate = "";

    function valueOf(element, fallback) { return element.value || element.getAttribute("value") || fallback; }
    function selectedEndpoint() { return valueOf(endpoint, "custom"); }
    function definition() { return definitions.get(selectedEndpoint()); }
    function effectiveMethod() { return definition()?.method || valueOf(method, "POST"); }

    function updateUi() {
      const preset = definition(), custom = selectedEndpoint() === "custom";
      methodItem.hidden = !custom; pathItem.hidden = !custom; preview.hidden = custom;
      if (custom) path.setAttribute("required", ""); else path.removeAttribute("required");
      deviceItem.hidden = preset?.parameter !== "device";
      sceneItem.hidden = preset?.parameter !== "scene";
      if (preset) preview.textContent = preset.method + " " + preset.path;
      bodyItem.hidden = preset ? preset.bodyMode === "none" : effectiveMethod() !== "POST" && effectiveMethod() !== "PUT";
      const hasSample = selectedEndpoint() === "send-device-command" && commandTemplates.has(valueOf(device, ""));
      sampleBodyItem.hidden = bodyItem.hidden || !hasSample;
      if (bodyItem.hidden) status.textContent = ""; else validateJson();
    }

    function applyPresetBody() {
      const preset = definition();
      if (!preset?.defaultBody || !body) return;
      const current = valueOf(body, "").trim();
      const generic = `{
  "command": "",
  "parameter": "default",
  "commandType": "command"
}`;
      if (!current || current === generic.trim()) body.value = preset.defaultBody;
    }

    function applyDeviceCommandTemplate() {
      if (selectedEndpoint() !== "send-device-command") return;
      const template = commandTemplates.get(valueOf(device, ""));
      if (!template) return;
      const current = valueOf(body, "").trim();
      const generic = `{\n  "command": "",\n  "parameter": "default",\n  "commandType": "command"\n}`;
      if (!current || current === generic.trim() || current === lastAutoTemplate.trim()) {
        body.value = template;
        lastAutoTemplate = template;
        validateJson();
      }
    }

    function setDeviceCommandSample() {
      const template = commandTemplates.get(valueOf(device, ""));
      if (!template || selectedEndpoint() !== "send-device-command") return;
      body.value = template;
      lastAutoTemplate = template;
      validateJson();
    }

    function validateJson() {
      if (bodyItem.hidden) return;
      const value = valueOf(body, "");
      if (!value.trim()) { status.textContent = SwitchBotI18n.t("Empty body", "本文が空です"); status.className = ""; return; }
      try { JSON.parse(value); status.textContent = SwitchBotI18n.t("Valid JSON", "有効なJSON"); status.className = "valid"; }
      catch { status.textContent = SwitchBotI18n.t("Invalid JSON", "無効なJSON"); status.className = "invalid"; }
    }

    function onEndpointChanged() {
      catalogStatus.textContent = "";
      applyPresetBody();
      updateUi();
    }

    endpoint.addEventListener("valuechange", onEndpointChanged);
    method.addEventListener("valuechange", updateUi);
    device.addEventListener("valuechange", () => { applyDeviceCommandTemplate(); updateUi(); });
    sampleBodyButton.addEventListener("click", setDeviceCommandSample);
    document.addEventListener("input", event => { if (event.target?.getAttribute?.("setting") === "body") validateJson(); });

    streamDeckClient.sendToPropertyInspector.subscribe(ev => {
      const payload = ev?.payload;
      if (payload?.event === "getApiEndpoints" && Array.isArray(payload.definitions)) {
        definitions = new Map(payload.definitions.map(item => [item.id, item]));
        applyPresetBody();
        applyDeviceCommandTemplate();
        updateUi();
      }
      if (payload?.event === "getDevices" && payload.commandTemplates) {
        commandTemplates = new Map(Object.entries(payload.commandTemplates));
        applyDeviceCommandTemplate();
      }
      if ((payload?.event === "getDevices" || payload?.event === "getScenes") && payload.refreshFailed) {
        catalogStatus.textContent = SwitchBotI18n.t(
          "Refresh failed. Showing the saved catalog.",
          "更新に失敗しました。保存済みの一覧を表示しています。"
        );
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      updateUi();
      endpoint.updateComplete?.then(updateUi);
      method.updateComplete?.then(updateUi);
    });
    document.addEventListener("switchbot-locale-changed", () => {
      sampleBodyButton.textContent = SwitchBotI18n.t("Set sample JSON", "サンプルJSONを設定");
      updateUi();
    });
  </script>
  <script src="authentication.js"></script>
</body>
</html>
