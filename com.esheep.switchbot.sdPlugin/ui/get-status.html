<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>SwitchBot Get Status</title>
  <script src="localization.js"></script>
  <script src="sdpi-components.js"></script>
  <link rel="stylesheet" href="authentication.css" />
</head>
<body>
  <div id="switchbot-authentication"></div>
  <sdpi-item id="device-item" label="Device">
    <sdpi-select
      setting="deviceId"
      label-setting="deviceLabel"
      datasource="getDevices"
      loading="Loading saved devices..."
      placeholder="Run Get Devices first"
      show-refresh
      hot-reload>
    </sdpi-select>
  </sdpi-item>
  <div id="output-heading" class="section-heading">Output</div>
  <sdpi-item id="show-key-item" label="Show on key">
    <sdpi-checkbox setting="output.showStatusOnKey" default="true"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item id="copy-json-item" label="Copy JSON">
    <sdpi-checkbox setting="output.copyResponseToClipboard" default="false"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item id="pretty-item" label="Pretty print">
    <sdpi-checkbox setting="output.prettyPrint" default="true"></sdpi-checkbox>
  </sdpi-item>
  <script>
    function localizeUi() {
      const { t } = SwitchBotI18n;
      document.getElementById("device-item").label = t("Device", "デバイス");
      document.getElementById("output-heading").textContent = t("Output", "出力");
      document.getElementById("show-key-item").label = t("Show on key", "キーに表示");
      document.getElementById("copy-json-item").label = t("Copy JSON", "JSONをコピー");
      document.getElementById("pretty-item").label = t("Pretty print", "整形");
    }
    document.addEventListener("DOMContentLoaded", localizeUi);
    document.addEventListener("switchbot-locale-changed", localizeUi);
  </script>
  <script src="authentication.js"></script>
</body>
</html>
