<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>SwitchBot Get Scenes</title>
  <script src="sdpi-components.js"></script>
  <script src="localization.js"></script>
  <link rel="stylesheet" href="authentication.css" />
</head>
<body>
  <div id="catalog-heading" class="section-heading">Scene catalog</div>
  <div id="catalog-description" class="section-description">Pressing the action refreshes the saved scene catalog used by other actions.</div>
  <div id="switchbot-authentication"></div>
  <sdpi-item id="copy-json-item" label="__MSG_copyJson__">
    <sdpi-checkbox setting="output.copyResponseToClipboard" default="false"></sdpi-checkbox>
  </sdpi-item>
  <script>
    function localizeUi() {
      const { t } = SwitchBotI18n;
      document.getElementById("catalog-heading").textContent = t("Scene catalog", "シーン一覧");
      document.getElementById("catalog-description").textContent = t("Pressing the action refreshes the saved scene catalog used by other actions.", "アクションを押すと、他のアクションで使用する保存済みシーン一覧を最新化します。");
    }
    document.addEventListener("DOMContentLoaded", localizeUi);
    document.addEventListener("switchbot-locale-changed", localizeUi);
  </script>
  <script src="authentication.js"></script>
</body>
</html>
