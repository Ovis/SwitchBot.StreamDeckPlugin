<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <title>SwitchBot Get Devices</title>
  <script src="sdpi-components.js"></script>
  <script src="localization.js"></script>
  <link rel="stylesheet" href="authentication.css" />
</head>
<body>
  <div id="switchbot-authentication"></div>
  <sdpi-item id="copy-json-item" label="__MSG_copyJson__">
    <sdpi-checkbox setting="output.copyResponseToClipboard" default="false"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item id="catalog-item" label="__MSG_deviceCatalog__">
    Pressing the action refreshes the saved device catalog used by other actions.
  </sdpi-item>
  <script>
    function localizeUi() {
      const { t } = SwitchBotI18n;
      const catalog = document.getElementById("catalog-item");
      catalog.textContent = t("Pressing the action refreshes the saved device catalog used by other actions.", "アクションを押すと、他のアクションで使用する保存済みデバイス一覧を最新化します。");
    }
    document.addEventListener("DOMContentLoaded", localizeUi);
    document.addEventListener("switchbot-locale-changed", localizeUi);
  </script>
  <script src="authentication.js"></script>
</body>
</html>
