name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Capture sdpi-components
        uses: actions/upload-artifact@v4
        with:
          name: sdpi-components
          path: com.ovis.switchbot.sdPlugin/ui/sdpi-components.js
          if-no-files-found: error
      - name: Validate Stream Deck plugin
        run: npm run validate
