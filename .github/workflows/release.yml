name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve release version
        id: version
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Inspect distributable
        run: npm run security:dist

      - name: Pack plugin
        run: |
          mkdir -p dist
          npx streamdeck pack com.ovis.switchbot.sdPlugin \
            --version "${{ steps.version.outputs.manifest_version }}" \
            --output dist \
            --no-update-check
          package="$(find dist -maxdepth 1 -type f -name '*.streamDeckPlugin' -print -quit)"
          test -n "$package"
          mv "$package" "dist/SwitchBot-API-${GITHUB_REF_NAME}.streamDeckPlugin"

      - name: Create prerelease
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/SwitchBot-API-${GITHUB_REF_NAME}.streamDeckPlugin" \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --latest=false

      - name: Create stable release
        if: steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/SwitchBot-API-${GITHUB_REF_NAME}.streamDeckPlugin" \
            --verify-tag \
            --generate-notes
